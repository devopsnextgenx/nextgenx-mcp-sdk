name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCPPMCP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify install and exported targets
        if: runner.os == 'Linux'
        run: bash scripts/verify_install.sh build
      - name: HTTP performance smoke
        if: runner.os == 'Linux'
        run: python3 scripts/perf_smoke_http.py build/cppmcp_http_server
      - name: Fuzz smoke
        if: runner.os == 'Linux'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Release -DCPPMCP_BUILD_TESTS=OFF -DCPPMCP_BUILD_FUZZERS=ON
          cmake --build build-fuzz --target cppmcp_fuzz_mirrored_header cppmcp_fuzz_mcp_name_param cppmcp_fuzz_http_request --parallel
          for target in mirrored_header mcp_name_param http_request; do
            "./build-fuzz/cppmcp_fuzz_${target}" -runs=10 -max_len=512 -timeout=2
          done
